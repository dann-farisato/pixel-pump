<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Pump — a tiny pixel-art gym</title>
    <meta name="description" content="Walk around a cozy isometric pixel-art gym and train on six machines, each with its own workout mini-game." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231b1530'/%3E%3Crect x='2' y='7' width='12' height='2' fill='%23d7dbe6'/%3E%3Crect x='1' y='4' width='3' height='8' fill='%23ff4fa3'/%3E%3Crect x='12' y='4' width='3' height='8' fill='%23ff4fa3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <h1>Pixel<span>Pump</span></h1>
          <p>A tiny gym. Six machines. One sweaty sunset.</p>
        </div>
        <button id="mute" class="btn ghost" aria-pressed="true">Sound: on</button>
      </header>

      <main class="layout">
        <section class="stage-wrap">
          <div id="stage">
            <canvas id="game" tabindex="0" aria-label="Isometric pixel-art gym. Walk to a machine to start a workout."></canvas>
            <button id="prompt" hidden></button>
          </div>
          <p class="hint">
            <span><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> walk</span>
            <span><kbd>E</kbd> train</span>
            <span>or tap the floor and the machines</span>
          </p>
        </section>

        <aside class="side">
          <div id="panel" class="win" hidden></div>
          <div class="win card">
            <div class="win-bar"><span>Workout Card</span><span class="win-btns"><i></i><i></i></span></div>
            <div class="win-body">
              <div class="progress"><span id="card-progress">0 / 6 stations</span><div class="bar"><div id="card-fill"></div></div></div>
              <ul id="card-list"></ul>
              <p id="card-best" class="best"></p>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <div id="finale" class="overlay" hidden>
      <div class="win finale" role="dialog" aria-modal="true" aria-labelledby="f-title">
        <div class="win-bar"><span id="f-title">Workout complete!</span><span class="win-btns"><i></i><i></i></span></div>
        <div class="win-body">
          <div class="f-grid">
            <div><small>Stars</small><strong class="f-stars"></strong></div>
            <div><small>Time</small><strong class="f-time"></strong></div>
          </div>
          <p class="f-note"></p>
          <div class="actions">
            <button class="btn f-close">Keep roaming</button>
            <button class="btn primary f-again">Train again</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
